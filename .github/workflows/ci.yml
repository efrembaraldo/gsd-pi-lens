name: CI

# Fork CI (R008): verifies every push by cloning and building the gsd-pi
# monorepo in-job. The @gsd/* host is not installable from a package registry
# (workspace:* deps), so the SDK sources must come from a checked-out clone.
#
# The default branch of this fork is currently `master`, but R008 pins `main`.
# Cover BOTH so a default-branch rename to `main` cannot silently disable the
# whole pipeline; the branch that is not the default stays harmless (its pushes
# simply do not exist until it becomes the default).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per branch. Only a newer PR commit cancels the in-flight run;
# a pushed branch is allowed to run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      # The @gsd host is not installable from a registry (workspace:* deps,
      # 404) and no monorepo package ships a `pi` bin, so CI clones the
      # open-gsd/gsd-pi checkout and builds its SDK sources. `build:pi` is the
      # verified root script (same proven step as compat-smoke.yml Layer A).
      - name: Checkout + build gsd-pi SDK
        run: |
          set -uxo pipefail
          git clone --depth 1 https://github.com/open-gsd/gsd-pi.git /tmp/gsd-pi
          cd /tmp/gsd-pi
          corepack enable
          pnpm install --no-audit --no-fund
          pnpm run build:pi
          echo "GSD_PI_CHECKOUT=/tmp/gsd-pi" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # npm ci prunes extraneous packages from node_modules/@gsd/*, so the
      # host-provided types must be restored AFTER the install, never before.
      - name: Restore host-provided @gsd types
        run: node scripts/setup-types.mjs
      - name: Lint
        run: npm run lint
      # npm test routes through scripts/with-test-lock.mjs, which acquires the
      # machine-wide test-suite lock before running vitest.
      - name: Test
        run: npm test

  # Production install shape: verifies that a clean `npm install --omit=dev`
  # produces a package whose compiled entry loads and whose host-provided
  # dependencies are resolved exactly the way pi resolves them.
  prod-install-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore host-provided @gsd types
        run: node scripts/setup-types.mjs
      - name: Prune dev dependencies to the production shape
        run: npm prune --omit=dev
      - name: Check production install shape
        run: node scripts/check-prod-install-shape.mjs