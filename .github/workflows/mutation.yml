name: Mutation diff

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  mutation:
    name: mutation (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
      # The @gsd host is not installable from a registry (workspace:* deps,
      # 404) and no monorepo package ships a `pi` bin, so CI clones the
      # open-gsd/gsd-pi checkout and builds its SDK sources. `build:pi` is the
      # verified root script (same proven step as ci.yml's "Unit tests" job).
      - name: Checkout + build gsd-pi SDK
        run: |
          set -uxo pipefail
          git clone --depth 1 https://github.com/open-gsd/gsd-pi.git /tmp/gsd-pi
          cd /tmp/gsd-pi
          corepack enable
          pnpm install
          pnpm run build:pi
          echo "GSD_PI_CHECKOUT=/tmp/gsd-pi" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      # npm ci prunes extraneous packages from node_modules/@gsd/*, so the
      # host-provided types must be restored AFTER the install, never before.
      - name: Restore host-provided @gsd types
        run: node scripts/setup-types.mjs
      - run: npm run build
      # The six-file cap bounds the advisory lane at approximately 65 seconds
      # per changed file, based on the observed per-file Stryker runtime.
      - run: node scripts/stryker-diff.mjs --base "origin/${{ github.base_ref }}" --max-files 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
